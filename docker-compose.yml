services:
  db:
    image: postgres:16
    container_name: fintrack-db
    environment:
      POSTGRES_DB: fintrack
      POSTGRES_USER: fintrack
      POSTGRES_PASSWORD: fintrack
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fintrack -d fintrack"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: fintrack-app
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/fintrack
      SPRING_DATASOURCE_USERNAME: fintrack
      SPRING_DATASOURCE_PASSWORD: fintrack
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET no arquivo .env}
    ports:
      - "8080:8080"

volumes:
  pgdata: